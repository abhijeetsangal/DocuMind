<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuMind Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background: #0c0a09;
            color: #EDE6DA;
        }

        .app {
            max-width: 720px;
            margin: 40px auto;
            background: #14110F;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(201,164,97,0.08);
            display: flex;
            flex-direction: column;
            height: 85vh;
        }

        .app-header {
            padding: 22px 26px 18px;
            border-bottom: 1px solid rgba(201,164,97,0.15);
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .app-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 700;
            margin: 0;
            color: #F2ECE0;
            letter-spacing: 0.3px;
        }
        #docLabel {
            font-size: 12px;
            color: #8A8175;
            font-style: italic;
            max-width: 220px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding-right: 2px;
        }

        .upload-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 26px;
            background: #17130F;
            border-bottom: 1px solid rgba(201,164,97,0.1);
        }

        .upload-bar input[type="file"] {
            font-size: 12px;
            color: #8A8175;
            flex: 1;
        }

        .upload-bar input[type="file"]::file-selector-button {
            background: transparent;
            border: 1px solid rgba(201,164,97,0.4);
            color: #C9A461;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            margin-right: 10px;
        }

        .upload-bar button {
            padding: 8px 18px;
            border: none;
            border-radius: 6px;
            background: #C9A461;
            color: #14110F;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            letter-spacing: 0.2px;
        }

        .upload-bar button:disabled {
            background: #4a4438;
            color: #8A8175;
            cursor: not-allowed;
        }

        #documentSelect {
            margin-left: auto;
            padding: 7px 10px;
            border-radius: 6px;
            border: 1px solid rgba(201,164,97,0.25);
            background: #14110F;
            color: #C9A461;
            font-size: 12px;
            max-width: 160px;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 22px 26px;
        }

        .msg {
            margin: 12px 0;
            padding: 12px 16px;
            border-radius: 10px;
            max-width: 78%;
            font-size: 14.5px;
            line-height: 1.55;
            white-space: pre-wrap;
        }

        .msg.question {
            margin-left: auto;
            background: #C9A461;
            color: #14110F;
            font-weight: 500;
        }

        .msg.answer {
            margin-right: auto;
            background: #1E1A17;
            color: #EDE6DA;
            border: 1px solid rgba(201,164,97,0.1);
        }

        .msg.system {
            margin: 12px auto;
            text-align: center;
            background: none;
            color: #6f675c;
            font-size: 12px;
            font-style: italic;
        }

        .sources-toggle {
            margin-top: 10px;
            font-size: 11px;
            color: #C9A461;
            cursor: pointer;
            opacity: 0.85;
        }

        .sources-toggle:hover { opacity: 1; }

        .source-item {
            padding: 8px 10px;
            margin-top: 6px;
            background: #14110F;
            border-radius: 6px;
            border-left: 2px solid #C9A461;
            font-size: 12px;
            color: #b3a998;
        }

        .input-bar {
            display: flex;
            gap: 10px;
            padding: 16px 26px;
            background: #17130F;
            border-top: 1px solid rgba(201,164,97,0.1);
        }

        .input-bar input {
            flex: 1;
            padding: 11px 14px;
            border: 1px solid rgba(201,164,97,0.2);
            border-radius: 8px;
            background: #0c0a09;
            color: #EDE6DA;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
        }

        .input-bar input::placeholder { color: #6f675c; }
        .input-bar input:focus { outline: none; border-color: #C9A461; }

        .input-bar button {
            padding: 11px 22px;
            border: none;
            border-radius: 8px;
            background: #C9A461;
            color: #14110F;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }

        .input-bar button:disabled {
            background: #4a4438;
            color: #8A8175;
            cursor: not-allowed;
        }

        #chat::-webkit-scrollbar { width: 8px; }
        #chat::-webkit-scrollbar-thumb { background: #2a2520; border-radius: 4px; }
    </style>
</head>

<body>

    <div class="app">
        <div class="app-header">
            <h1>DocuMind</h1>
            <span id="docLabel">No document loaded</span>
        </div>

        <div class="upload-bar">
            <input type="file" id="fileInput" accept=".pdf">
            <button id="uploadButton">Upload</button>
            <select id="documentSelect">
                <option value="">-- Select a document --</option>
            </select>
        </div>

        <div id="chat"></div>

        <div class="input-bar">
            <input type="text" id="questionInput" placeholder="Upload a document first..." disabled>
            <button id="askButton" disabled>Ask</button>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const uploadButton = document.getElementById('uploadButton');
        const chat = document.getElementById('chat');
        const questionInput = document.getElementById('questionInput');
        const askButton = document.getElementById('askButton');
        const docLabel = document.getElementById('docLabel');
        const documentSelect = document.getElementById('documentSelect');

        let currentDocument = null;

        function addMessage(text, type, sources) {
            const div = document.createElement('div');
            div.classList.add('msg', type);
            div.textContent = text;

            if (sources && sources.length > 0) {
                const sourcesToggle = document.createElement('div');
                sourcesToggle.classList.add('sources-toggle');
                sourcesToggle.textContent = `${sources.length} source${sources.length === 1 ? '' : 's'} · click to view`;

                const sourcesBox = document.createElement('div');
                sourcesBox.style.display = 'none';

                sources.forEach((s) => {
                    const sourceDiv = document.createElement('div');
                    sourceDiv.classList.add('source-item');
                    sourceDiv.textContent = `${s.score}% match — ${s.text}`;
                    sourcesBox.appendChild(sourceDiv);
                });

                sourcesToggle.addEventListener('click', () => {
                    sourcesBox.style.display = sourcesBox.style.display === 'none' ? 'block' : 'none';
                });

                div.appendChild(sourcesToggle);
                div.appendChild(sourcesBox);
            }

            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        async function loadDocumentList(selectAfterLoad) {
            try {
                const response = await fetch('/documents');
                const data = await response.json();

                documentSelect.innerHTML = '<option value="">-- Select a document --</option>';
                data.documents.forEach(name => {
                    const option = document.createElement('option');
                    option.value = name;
                    option.textContent = name;
                    documentSelect.appendChild(option);
                });

                if (selectAfterLoad) {
                    documentSelect.value = selectAfterLoad;
                }
            } catch (error) {
                console.error('Error loading document list:', error);
            }
        }

        documentSelect.addEventListener('change', () => {
            const selected = documentSelect.value;
            if (selected) {
                currentDocument = selected;
                docLabel.textContent = selected;
                chat.innerHTML = '';
                addMessage(`Switched to "${selected}". Ask a question below.`, 'system');
                questionInput.disabled = false;
                questionInput.placeholder = 'Ask a question...';
                askButton.disabled = false;
            }
        });

        uploadButton.addEventListener('click', async () => {
            const file = fileInput.files[0];
            if (!file) {
                addMessage('Please choose a PDF file first.', 'system');
                return;
            }

            const formData = new FormData();
            formData.append('document', file);

            uploadButton.disabled = true;
            addMessage(`Uploading "${file.name}"...`, 'system');

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (data.error) {
                    addMessage('Error: ' + data.error, 'system');
                } else {
                    currentDocument = data.filename;
                    docLabel.textContent = data.filename;
                    addMessage(`Document ready (${data.chunkCount} chunk${data.chunkCount === 1 ? '' : 's'}). Ask a question below.`, 'system');

                    questionInput.disabled = false;
                    questionInput.placeholder = 'Ask a question...';
                    askButton.disabled = false;
                    questionInput.focus();

                    loadDocumentList(data.filename);
                }
            } catch (error) {
                addMessage('Upload failed: ' + error.message, 'system');
            } finally {
                uploadButton.disabled = false;
            }
        });

        async function askQuestion() {
            const question = questionInput.value.trim();
            if (!question || !currentDocument) return;

            addMessage(question, 'question');
            questionInput.value = '';
            askButton.disabled = true;

            const thinkingDiv = document.createElement('div');
            thinkingDiv.classList.add('msg', 'system');
            thinkingDiv.textContent = 'Thinking...';
            chat.appendChild(thinkingDiv);
            chat.scrollTop = chat.scrollHeight;

            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question: question,
                        documentName: currentDocument
                    })
                });
                const data = await response.json();

                thinkingDiv.remove();

                if (data.error) {
                    addMessage('Error: ' + data.error, 'system');
                } else {
                    addMessage(data.answer, 'answer', data.sources);
                }
            } catch (error) {
                thinkingDiv.remove();
                addMessage('Error: ' + error.message, 'system');
            } finally {
                askButton.disabled = false;
                questionInput.focus();
            }
        }

        askButton.addEventListener('click', askQuestion);

        questionInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                askQuestion();
            }
        });

        loadDocumentList();
    </script>

</body>
</html>
